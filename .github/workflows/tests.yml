# Runs the project's checks on GitHub for every push and pull request:
# ruff lint, ruff formatting and the test suite. GPU tests stay skipped,
# because these machines have no GPU (see the markers in pyproject.toml).
name: Tests

on:
  push:
  pull_request:

# Read-only access to the code is all this workflow needs; it uses no secrets.
permissions:
  contents: read

# A newer push to the same branch or pull request cancels the older run,
# which saves Actions minutes. Runs on main are never cancelled, so every
# merge gets a full result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  tests:
    # Branch protection requires this check by name; see docs/runbooks/github.md.
    name: Lint and test
    runs-on: ubuntu-latest
    # A run normally takes under a minute; this enforces the 5-minute limit.
    timeout-minutes: 5
    env:
      # Every uv command in this job fails instead of changing uv.lock.
      UV_LOCKED: "1"
    steps:
      # Actions are pinned to exact commits; the comment gives the version.
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # The uv version that Claude Code cloud sessions use.
          version: "0.11.32"
          enable-cache: true
          # Downloading the packages is faster than restoring a 290 MB cache,
          # so keep only what is slow to rebuild (Astral's advice for
          # GitHub-hosted runners).
          prune-cache: true

      # --locked (also set above for every step) stops with an error instead
      # of changing uv.lock. The default groups give the CPU-only torch
      # build and the dev tools.
      - name: Install the CPU environment from uv.lock
        run: uv sync --locked

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Check formatting with ruff
        run: uv run ruff format --check .

      - name: Run the tests (GPU tests are skipped)
        run: uv run pytest -q
